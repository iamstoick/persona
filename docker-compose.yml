# Guard stub — this repo has no default compose stack on purpose.
#
# A bare `docker compose ...` command previously started the DEVELOPMENT stack
# on the production server by accident, publicly exposing dev Postgres and
# Redis. The real stacks live in explicit files, and this stub always fails
# fast so that mistake is impossible.
#
# Local development:
#   docker compose -f docker-compose.dev.yml up --build
#   (or: npm run dev)
#
# Production (on the server, from /opt/geraldvillorente):
#   ./deploy.sh

services:
  guard:
    # BARE_COMPOSE_BLOCKED is never set — the :? expansion below fails at
    # parse time with the message. This is intentional.
    image: "${BARE_COMPOSE_BLOCKED:?Bare `docker compose` is disabled in this repo. Use `docker compose -f docker-compose.dev.yml ...` for local dev, or `./deploy.sh` on the production server.}"
