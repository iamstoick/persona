<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img"><rect width="1600" height="700" fill="#0D0D0D"/><text x="360" y="70" font-size="24" fill="#5A5A5A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" letter-spacing="6">FEAR</text><text x="1240" y="70" font-size="24" fill="#63E6A0" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" letter-spacing="6">FACT</text><rect x="40" y="110" width="640" height="150" rx="12" fill="#141414" stroke="#2A2A2A" stroke-width="1.5" /><text x="360" y="200" font-size="40" fill="#9A9A9A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" >“It makes things up.”</text><path d="M720 185 h 140 l -30 -30 m 30 30 l -30 30" fill="none" stroke="#FFB86B" stroke-width="8" stroke-linecap="round"/><rect x="920" y="110" width="640" height="150" rx="12" fill="#141414" stroke="#63E6A0" stroke-width="1.5" /><text x="1240" y="200" font-size="40" fill="#E8E8E8" font-weight="800" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" >Give it sources. Check.</text><rect x="40" y="300" width="640" height="150" rx="12" fill="#141414" stroke="#2A2A2A" stroke-width="1.5" /><text x="360" y="390" font-size="40" fill="#9A9A9A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" >“Students will cheat.”</text><path d="M720 375 h 140 l -30 -30 m 30 30 l -30 30" fill="none" stroke="#FFB86B" stroke-width="8" stroke-linecap="round"/><rect x="920" y="300" width="640" height="150" rx="12" fill="#141414" stroke="#63E6A0" stroke-width="1.5" /><text x="1240" y="390" font-size="40" fill="#E8E8E8" font-weight="800" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" >Grade reasoning, not recall.</text><rect x="40" y="490" width="640" height="150" rx="12" fill="#141414" stroke="#2A2A2A" stroke-width="1.5" /><text x="360" y="580" font-size="40" fill="#9A9A9A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" >“It replaces teachers.”</text><path d="M720 565 h 140 l -30 -30 m 30 30 l -30 30" fill="none" stroke="#FFB86B" stroke-width="8" stroke-linecap="round"/><rect x="920" y="490" width="640" height="150" rx="12" fill="#141414" stroke="#63E6A0" stroke-width="1.5" /><text x="1240" y="580" font-size="40" fill="#E8E8E8" font-weight="800" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" >Replaces tasks. Not judgment.</text></svg>