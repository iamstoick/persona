<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" width="760" height="680" role="img" aria-label="Diagram: how a desktop app runs, from double-click to screen">
  <rect width="760" height="680" fill="#0D0D0D"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5A5A5A"/>
    </marker>
  </defs>
  <text x="380" y="48" font-size="30" fill="#E8E8E8" font-weight="800" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">How a desktop app runs</text>
  <text x="380" y="78" font-size="16" fill="#9A9A9A" font-weight="500" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">follow the journey of one double-click</text>

  <g font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <circle cx="96" cy="148" r="20" fill="#141414" stroke="#63E6A0" stroke-width="2"/>
    <text x="96" y="156" font-size="20" fill="#63E6A0" font-weight="800" text-anchor="middle">1</text>
    <rect x="130" y="110" width="500" height="76" rx="10" fill="#141414" stroke="#2E2E2E" stroke-width="1.5"/>
    <text x="155" y="142" font-size="21" fill="#E8E8E8" font-weight="700">You double-click the app</text>
    <text x="155" y="168" font-size="15" fill="#9A9A9A" font-weight="500">the journey begins with you</text>

    <line x1="380" y1="192" x2="380" y2="214" stroke="#5A5A5A" stroke-width="3" marker-end="url(#arrow)"/>

    <circle cx="96" cy="260" r="20" fill="#141414" stroke="#63E6A0" stroke-width="2"/>
    <text x="96" y="268" font-size="20" fill="#63E6A0" font-weight="800" text-anchor="middle">2</text>
    <rect x="130" y="222" width="500" height="76" rx="10" fill="#141414" stroke="#2E2E2E" stroke-width="1.5"/>
    <text x="155" y="254" font-size="21" fill="#E8E8E8" font-weight="700">Disk wakes the app file up</text>
    <text x="155" y="280" font-size="15" fill="#9A9A9A" font-weight="500">the SSD is where files sleep long-term</text>

    <line x1="380" y1="304" x2="380" y2="326" stroke="#5A5A5A" stroke-width="3" marker-end="url(#arrow)"/>

    <circle cx="96" cy="372" r="20" fill="#141414" stroke="#63E6A0" stroke-width="2"/>
    <text x="96" y="380" font-size="20" fill="#63E6A0" font-weight="800" text-anchor="middle">3</text>
    <rect x="130" y="334" width="500" height="76" rx="10" fill="#141414" stroke="#2E2E2E" stroke-width="1.5"/>
    <text x="155" y="366" font-size="21" fill="#E8E8E8" font-weight="700">App moves into Memory (RAM)</text>
    <text x="155" y="392" font-size="15" fill="#9A9A9A" font-weight="500">RAM is its desk — super fast but forgetful</text>

    <line x1="380" y1="416" x2="380" y2="438" stroke="#5A5A5A" stroke-width="3" marker-end="url(#arrow)"/>

    <circle cx="96" cy="484" r="20" fill="#141414" stroke="#63E6A0" stroke-width="2"/>
    <text x="96" y="492" font-size="20" fill="#63E6A0" font-weight="800" text-anchor="middle">4</text>
    <rect x="130" y="446" width="500" height="76" rx="10" fill="#141414" stroke="#2E2E2E" stroke-width="1.5"/>
    <text x="155" y="478" font-size="21" fill="#E8E8E8" font-weight="700">CPU runs the instructions</text>
    <text x="155" y="504" font-size="15" fill="#9A9A9A" font-weight="500">the chef, following the recipe step by step</text>

    <line x1="380" y1="528" x2="380" y2="550" stroke="#5A5A5A" stroke-width="3" marker-end="url(#arrow)"/>

    <circle cx="96" cy="596" r="20" fill="#141414" stroke="#63E6A0" stroke-width="2"/>
    <text x="96" y="604" font-size="20" fill="#63E6A0" font-weight="800" text-anchor="middle">5</text>
    <rect x="130" y="558" width="500" height="76" rx="10" fill="#141414" stroke="#63E6A0" stroke-width="2"/>
    <text x="155" y="590" font-size="21" fill="#E8E8E8" font-weight="700">You see windows and files</text>
    <text x="155" y="616" font-size="15" fill="#9A9A9A" font-weight="500">results on screen, work saved back to disk</text>
  </g>
</svg>
